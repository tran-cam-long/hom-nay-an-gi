services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homnayangi_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homnayangi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net

  service:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: camlongtran/hom-nay-an-gi-service:latest
    container_name: homnay_service
    restart: unless-stopped
    environment:
      PORT: "8100"
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: "cqManIGq8R3i52nC8rL2wBEqBYuacxQ8pd14OTh5fLu"
      SPRING_DATASOURCE_HOST: postgres
      SPRING_DATASOURCE_PORT: 5432
      SPRING_DATASOURCE_DBNAME: homnayangi_db
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8100:8100"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
